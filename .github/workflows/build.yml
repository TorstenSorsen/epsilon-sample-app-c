name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: numworks/setup-arm-toolchain@latest

      - name: Check toolchain
        run: |
          node --version
          npm --version
          arm-none-eabi-gcc --version

      - name: Check EADK flags
        run: npx --yes -- nwlink@0.0.16 eadk-cflags

      - name: Build .nwa
        run: make build

      - name: Upload app.nwa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: night-drift-app
          path: output/app.nwa
