name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install toolchain
        uses: numworks/setup-arm-toolchain@latest
      - name: Build .nwa
        run: make build
      - name: Upload app.nwa
        uses: actions/upload-artifact@v4
        with:
          name: night-drift-app
          path: output/app.nwa
